<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Replaced at build time. Render passes --base-href / so this becomes "/". -->
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="HastVeda — AI-powered palm reading and daily Vedic guidance."
    />
    <meta name="theme-color" content="#D4AF37" />
    <meta name="background-color" content="#0A0A0F" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Standalone home-screen app. Safari on iPhone still reads the apple- prefix. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HastVeda" />
    <link rel="apple-touch-icon" href="icons/Icon-180.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png" />

    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="preconnect" href="https://download.hastveda.co" crossorigin />
    <link rel="preload" as="image" href="assets/assets/images/hastveda_logo.png" />
    <link rel="preload" as="script" href="flutter_bootstrap.js" />

    <title>HastVeda</title>
    <link rel="manifest" href="manifest.json" />
    
    <script src="https://github.com/corbado/flutter-passkeys/releases/download/2.5.0/bundle.js"
        type="application/javascript" defer></script>
    <script
      src="https://sdk.cashfree.com/js/v3/cashfree.js"
      data-cashfree-sdk="v3"
      async
    ></script>

    <style>
      body {
        background: #0a0a0f;
        margin: 0;
        overflow: hidden;
      }

      #loading-container {
        display: flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        width: 100%;
        height: 100%;
        background-color: #0a0a0f;
      }

      .loader {
        border: 6px solid rgba(212, 168, 67, 0.25);
        border-top: 6px solid #d4a843;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      #load-error {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: absolute;
        width: 100%;
        height: 100%;
        background-color: #0a0a0f;
        color: #ccc;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }

      #load-error.visible {
        display: flex;
      }

      #load-error h2 {
        color: #d4a843;
        margin: 0 0 12px;
        font-size: 1.25rem;
      }

      #load-error pre {
        background: #1a1a1a;
        padding: 12px;
        border-radius: 8px;
        overflow: auto;
        max-width: 90%;
        font-size: 12px;
        text-align: left;
      }
    </style>
  </head>
  <body
    style="
      background-color: #0a0a0f;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    "
  >
    <!-- Loader Container -->
    <div id="loading-container">
      <div class="loader"></div>
    </div>

    <!-- Shown when a startup error occurs -->
    <div id="load-error">
      <h2>Something went wrong</h2>
      <p>The app couldn’t initialize properly due to a code-related issue</p>
    </div>

    <script>
      (function () {
        window.parent.postMessage({ type: "LOADING_STARTED" }, "*");
      })();
    </script>

    <script src="flutter_bootstrap.js" async></script>

    <script>
      // Auto-update. skipWaiting and clients.claim live in sw.js. This page
      // reloads once a new worker takes control, and asks for a new deployment
      // on load and again every hour.
      (function () {
        if (!("serviceWorker" in navigator)) return;

        var baseEl = document.querySelector("base");
        var scope = (baseEl && baseEl.getAttribute("href")) || "/";
        if (scope.charAt(scope.length - 1) !== "/") scope += "/";
        var workerUrl = scope + "sw.js";

        navigator.serviceWorker
          .register(workerUrl, { scope: scope, updateViaCache: "none" })
          .catch(function () {});

        navigator.serviceWorker.ready.then(function (registration) {
          function checkForUpdate() {
            registration.update().catch(function () {});
          }
          checkForUpdate();
          setInterval(checkForUpdate, 60 * 60 * 1000);
        });
      })();
    </script>

    <script>
      var appLoaded = false;

      function removeLoader() {
        var loader = document.getElementById("loading-container");
        if (loader) {
          loader.style.display = "none";
        }
      }

      function isFlutterFailure(source, message) {
        var text = String(source || "") + "\n" + String(message || "");
        return /flutter_bootstrap|main\.dart\.js|dart_sdk|canvaskit|flutter\.js/i.test(
          text,
        );
      }

      function showLoadError(message, detail) {
        if (appLoaded) return;
        removeLoader();
        var errEl = document.getElementById("load-error");
        if (errEl) {
          errEl.classList.add("visible");
          var paragraph = errEl.querySelector("p");
          if (paragraph && message) paragraph.textContent = String(message);
        }
        if (detail) console.error("[HastVeda] startup failed", detail);
        window.parent.postMessage(
          { type: "LOADING_ERROR", message: message },
          "*",
        );
        window.parent.postMessage({ type: "LOADING_COMPLETED" }, "*");
      }

      window.addEventListener("flutter-first-frame", function () {
        appLoaded = true;
        removeLoader();
        var errEl = document.getElementById("load-error");
        if (errEl) errEl.classList.remove("visible");
        window.parent.postMessage({ type: "LOADING_COMPLETED" }, "*");
      });

      window.onerror = function (message, source, lineno, colno, error) {
        if (!isFlutterFailure(source, message)) return false;
        var detail = [
          message,
          source ? source + ":" + lineno + ":" + colno : "",
        ]
          .filter(Boolean)
          .join("\n");
        if (error && error.stack) detail += "\n" + error.stack;
        showLoadError(message, detail);
        return false;
      };

      window.addEventListener("unhandledrejection", function (event) {
        var reason = event.reason;
        var msg = reason && (reason.message || String(reason));
        var stack = (reason && reason.stack) || "";
        if (!isFlutterFailure(stack, msg)) return;
        showLoadError(
          msg || "Unhandled error",
          stack && stack !== msg ? stack : null,
        );
      });

      // If the engine never paints, stop the loader. A Flutter view that is
      // already on the page should open the app instead of the error panel.
      setTimeout(function () {
        if (appLoaded) return;
        if (document.querySelector("flutter-view")) {
          appLoaded = true;
          removeLoader();
          var errEl = document.getElementById("load-error");
          if (errEl) errEl.classList.remove("visible");
          return;
        }
        var loader = document.getElementById("loading-container");
        if (loader && loader.style.display !== "none") {
          showLoadError(
            "Loading timed out",
            "The app did not start in time. Please refresh the page.",
          );
        }
      }, 90000);
    </script>

    <script>
      // Navigation tracking
      (function (history) {
        const pushState = history.pushState;
        const replaceState = history.replaceState;

        function logNavigation(method, url) {
            if (!url) return;

            var actualPath = url;
            var lastHashSlash = url.lastIndexOf('#/');
            if (lastHashSlash !== -1) {
              actualPath = '/' + url.substring(lastHashSlash + 2);
            }

            var formattedUrl = actualPath;
            if (actualPath.startsWith('/') && !actualPath.startsWith('/#')) {
              formattedUrl = '/#' + actualPath;
            }

            window.parent.postMessage({
              type: "NAVIGATION",
              method: method,
              url: formattedUrl
            }, "*");
          }

        history.pushState = function (state, title, url) {
          logNavigation("pushState", url);
          return pushState.apply(history, arguments);
        };

        history.replaceState = function (state, title, url) {
          logNavigation("replaceState", url);
          return replaceState.apply(history, arguments);
        };

        window.addEventListener("popstate", function (event) {
          logNavigation("popstate", location.href);
        });
      })(window.history);
    </script>

    <!-- Plugin initialization code will be injected into flutter_plugins.js -->
    <script src="flutter_plugins.js" defer></script>
    <script type="module" src="https://static.rocket.new/rocket-shot.js?v=0.0.2"></script>
  
  </body>
</html>
