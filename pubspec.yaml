name: hastveda
description: HastVeda — Ancient Wisdom, Modern Palm Reading Insights
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:       # CRITICAL: Required for every Flutter project - DO NOT REMOVE
    sdk: flutter # CRITICAL: Required for every Flutter project - DO NOT REMOVE
  
  # CRITICAL: Core UI and responsive design - DO NOT REMOVE OR MODIFY
  supabase_flutter: ^2.9.1
  sizer: ^2.0.15              # Required for responsive design system
  flutter_svg: ^2.0.9        # Required for SVG icon support
  google_fonts: ^6.1.0       # Required for typography (replaces local fonts)
  shared_preferences: ^2.2.2 # Required for local data storage
  web: ^1.1.1
  
  # Feature dependencies - safe to modify
  cached_network_image: ^3.3.1
  connectivity_plus: ^6.1.4
  dio: ^5.4.0
  fluttertoast: ^8.2.4
  fl_chart: ^0.65.0
  go_router: ^14.6.1
  camera: ^0.10.5+5
  permission_handler: ^11.1.0
  image_picker: ^1.0.4
  provider: ^6.1.5+1
  path_provider: ^2.1.5
  wakelock_plus: ^1.4.0     # Keeps the screen awake during palm capture/analysis
  flutter_cashfree_pg_sdk: ^2.4.0+52 # Official Cashfree Flutter SDK for WebCheckout payment integration
  share_plus: ^10.1.4        # Android share sheet for PDF sharing
  in_app_review: ^2.0.12     # Google Play in-app review mechanism
  speech_to_text: ^7.4.0     # Speech-to-text for microphone input in Ask HastVeda
  flutter_tts: ^4.2.5        # Text-to-speech for reading answers aloud in Ask HastVeda
  flutter_local_notifications: ^19.4.0 # Daily horoscope pop-ups on the phone screen
  timezone: ^0.10.1

  flutter_riverpod: any
  universal_html: ^2.2.4
  url_strategy: ^0.3.0
dev_dependencies:
  flutter_test:    # CRITICAL: Required for Flutter project testing - DO NOT REMOVE
    sdk: flutter   # CRITICAL: Required for Flutter project testing - DO NOT REMOVE
  flutter_lints: ^5.0.0 # CRITICAL: Required for code quality - DO NOT REMOVE

flutter:
  uses-material-design: true # CRITICAL: Required for Material icon font - DO NOT REMOVE
  assets:
    - assets/
    - assets/images/
    - env.json
    - assets/images/hastveda_onboarding_1_cosmic_blueprint.png
    - assets/images/hastveda_onboarding_2_ai_analysis.png
    - assets/images/hastveda_onboarding_3_daily_guidance.png
  # CRITICAL ASSET MANAGEMENT RULES:
  # - DO NOT ADD NEW ASSET DIRECTORIES (assets/svg/, assets/icons/, etc.)
  # - ONLY USE EXISTING AND ITEMS AVAILABLE IN THE DIRECTORIES LISTED ABOVE (assets/, assets/images/)
  
  # CRITICAL FONTS RULE: 
  # - THIS PROJECT USES GOOGLE FONTS INSTEAD OF LOCAL FONTS
  # - DO NOT ADD ANY LOCAL FONTS SECTION OR FONT FILES
