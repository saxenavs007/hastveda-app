# Static site on Render.
# A static site is type: web with runtime: static.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: hastveda
    runtime: static
    buildCommand: bash build.sh
    staticPublishPath: build/web
    # Existing files (JS, assets, icons) are served as-is.
    # Any other path is rewritten to index.html so Flutter can route it.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /flutter_bootstrap.js
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /flutter_service_worker.js
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /sw.js
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /main.dart.js
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /assets/*
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /canvaskit/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /icons/*
        name: Cache-Control
        value: public, max-age=604800
